name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Pull published image
        run: docker compose -f deployment/docker-compose.yml pull

      - name: Deploy with Docker Compose
        run: docker compose -f deployment/docker-compose.yml up -d

      - name: Run smoke tests
        run: |
          chmod +x deployment/smoke_test.sh
          deployment/smoke_test.sh http://localhost:8000 deployment/sample.jpg

      - name: Tear down
        if: always()
        run: docker compose -f deployment/docker-compose.yml down
