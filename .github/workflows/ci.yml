name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t cats-dogs-classifier:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag cats-dogs-classifier:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-classifier:latest
          docker tag cats-dogs-classifier:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-classifier:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-classifier:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-classifier:${{ github.sha }}
